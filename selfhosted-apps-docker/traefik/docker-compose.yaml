secrets:
  traefik_basic_auth_credentials:
    file: $SECRETSDIR/traefik_basic_auth_credentials
  cf-token:
    file: $SECRETSDIR/cf-token
  cf-email:
    file: $SECRETSDIR/cf-email

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    secrets:
      - traefik_basic_auth_credentials
      - cf-token
      - cf-email
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TRAEFIK_DASHBOARD_CREDENTIALS=/run/secrets/traefik_basic_auth_credentials
      - CF_API_EMAIL=/run/secrets/cf_email
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/traefik.yaml:ro
      - ./config/conf/:/etc/traefik/conf/
      - ./config/certs/acme.json:/acme.json
      - ./logs:/var/log/traefik
      - ./config/certs:/etc/traefik/certs/
    labels:
      - "traefik.enable=true"
    networks:
      - proxy
      - crowdsec

networks:
  proxy:
    external: true
  crowdsec:
    external: true

