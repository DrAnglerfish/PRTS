secrets:
  traefik_basic_auth_credentials:
    file: $SECRETSDIR/traefik_basic_auth_credentials
  cf-token:
    file: $SECRETSDIR/cf-token
  cf-email:
    file: $SECRETSDIR/cf-email

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    secrets:
      - traefik_basic_auth_credentials
      - cf-token
      - cf-email
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TRAEFIK_DASHBOARD_CREDENTIALS=/run/secrets/traefik_basic_auth_credentials
      - CF_API_EMAIL=/run/secrets/cf_email
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/traefik.yaml:ro
      - ./config/conf/:/etc/traefik/conf/
      - ./config/certs/acme.json:/acme.json
      - ./logs:/var/log/traefik
      - ./config/certs:/etc/traefik/certs/
    labels:
      - "traefik.enable=true"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.traefik.rule=Host(`traefik.prts.live`)"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.middlewares=https-redirectscheme@file"

      # Secure router (HTTPS)
      - "traefik.http.routers.traefik-secure.rule=Host(`traefik.prts.live`)"
      - "traefik.http.routers.traefik-secure.entrypoints=https"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.service=api@internal"

      # Apply multiple middlewares to secure router (ORDER MATTERS!)
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth,secure-headers@file"

      # Basic Auth Middleware
      - "traefik.http.middlewares.traefik-auth.basicauth.usersfile=/run/secrets/traefik_basic_auth_credentials"

      # TLS config (if needed)
      #      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=prts.live"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.prts.live"
        #      - "traefik.http.routers.traefik-secure.tls.domains[1].main=jbwllc.info"
        #      - "traefik.http.routers.traefik-secure.tls.domains[1].sans=*.jbwllc.info"

    networks:
      - proxy
      - crowdsec

  whoami:
    image: "traefik/whoami"
    container_name: "whoami"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.prts.live`)"
      - "traefik.http.routers.whoami.entrypoints=http"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapikey=NxacdrD2i8349LnnZJ88wQVJVO3WcuR8wolsXzKkyrM"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapischeme=http"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapihost=crowdsec:8080"
      - "traefik.http.routers.whoami.service=whoami"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
  crowdsec:
    external: true

