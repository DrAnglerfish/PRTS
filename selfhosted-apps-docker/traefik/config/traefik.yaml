global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: true
  debug: false
entryPoints:
  http:
    address: ":80"
    http3: {}
    forwardedHeaders:
      trustedIPs: &trustedIps
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    http:
      middlewares:
        - "secure-headers@file"
        - "real-ip-foo@file"
        - "cloudflarewarp@file"
        - "crowdsec@file"
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: ":443"
    http3: {}
    transport:
      respondingTimeouts:
        readTimeout: "0s"
    forwardedHeaders:
      trustedIPs: *trustedIps
    http:
      middlewares:
        - "secure-headers@file"
        - "real-ip-foo@file"
        - "cloudflarewarp@file"
        - "crowdsec@file"

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
  file:
    directory: /etc/traefik/conf/
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      caServer: https://acme-v02.api.letsencrypt.org/directory            # production (default)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory  # staging (testing)
      email: email@domain.com
      storage: /etc/traefik/certs/acme.json
      dnsChallenge:
        provider: cloudflare
        # disablePropagationCheck: true # Some people using Cloudflare note this can solve DNS propagation issues.
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  level: INFO
  filePath: "/var/log/traefik/traefik.log"
  format: json
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  filters:
    statusCodes:
      - "200-299" # log successful http requests
      - "400-599" # log failed http requests
  # collect logs as in-memory buffer before writing into log file
  bufferingSize: 0
  fields:
    headers:
      defaultMode: drop # drop all headers per default
      names:
          User-Agent: keep # log user agent strings

experimental:
  plugins:
    cloudflarewarp:
      moduleName: github.com/BetterCorp/cloudflarewarp
      version: v1.3.3

    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4

    real-ip:
      moduleName: github.com/Paxxs/traefik-get-real-ip
      version: v1.0.3

